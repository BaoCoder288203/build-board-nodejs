# Project name intentionally not "build-board-nodejs": an old corrupted
# mailpit container (bda379568e2c) still appears under that project label in
# Docker Desktop and breaks `compose up` recreate for mailpit.
name: buildboard

services:
  postgres:
    image: postgres:17-alpine
    container_name: buildboard-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: buildboard
      POSTGRES_PASSWORD: buildboard
      POSTGRES_DB: buildboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildboard -d buildboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: buildboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: buildboard-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  # Reuse existing local data volumes from the previous project name.
  postgres_data:
    name: build-board-nodejs_postgres_data
    external: true
  redis_data:
    name: build-board-nodejs_redis_data
    external: true
